name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 6 * * *" # Every day at 06:00 UTC
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database through the app
        # Hits an uncached route that reads real rows and writes the ping time,
        # so it counts as database activity. Vercel Cron calls the same route
        # 12 hours later (vercel.json), so one scheduler failing is not fatal.
        run: curl -fsS --retry 3 --retry-delay 30 "https://tv-time2.vercel.app/api/keep-alive?from=github"
