name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 6 * * *" # Every day at 06:00 UTC
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database through the app
        # Hits an uncached route that runs a real Supabase query, so the ping
        # counts as database activity. A weekly ping was too close to the
        # 7-day pause window: one delayed or skipped run and the project pauses.
        run: curl -fsS --retry 3 --retry-delay 30 https://tv-time2.vercel.app/api/keep-alive
